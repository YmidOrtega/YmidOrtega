name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # todos los días a medianoche UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate snake animation
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#800020&color_dots=#161b22,#38404a,#586069,#a0a6b0,#f0f6fc

      - name: Write the year before the snake eats it
        # snk writes dist/ as root from its container; take it back first.
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python3 .github/scripts/snake-intro.py dist/github-snake.svg dist/github-snake-dark.svg

      - name: Push the output to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
